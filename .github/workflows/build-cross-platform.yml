name: Build Cross-Platform

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform jobs to run
        required: true
        default: windows
        type: choice
        options:
          - windows
          - all

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  native-windows:
    name: Windows native runtime
    uses: ./.github/workflows/native-runtime.yml
    with:
      platform: windows

  native-linux:
    name: Linux native runtime
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' }}
    uses: ./.github/workflows/native-runtime.yml
    with:
      platform: linux

  native-macos:
    name: macOS native runtime
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' }}
    uses: ./.github/workflows/native-runtime.yml
    with:
      platform: macos

  checks:
    name: Tests and frontend
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          packages=(
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libusb-1.0-0-dev
          )
          missing_packages=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null | grep -q '^ii ' \
              || missing_packages+=("$package")
          done
          if (( ${#missing_packages[@]} == 0 )); then
            echo "Linux build dependencies are already installed."
            exit 0
          fi
          host_arch="$(dpkg --print-architecture)"
          apt_arch_args=(
            -o "APT::Architecture=${host_arch}"
            -o "APT::Architectures=${host_arch}"
            -o "Acquire::http::Timeout=30"
            -o "Acquire::https::Timeout=30"
            -o "Acquire::Retries=3"
            -o "DPkg::Lock::Timeout=60"
          )
          sudo apt-get "${apt_arch_args[@]}" update
          sudo apt-get "${apt_arch_args[@]}" install -y "${missing_packages[@]}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js for pnpm
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Cache pnpm with Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: true
          shared-key: checks-x86_64-unknown-linux-gnu-debug
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test UI logic
        run: node --test tests/*.test.ts

      - name: Build frontend
        run: pnpm build

  build-windows:
    name: Windows x64
    needs: [checks, native-windows]
    if: >-
      ${{
        always() && needs.native-windows.result == 'success' &&
        (needs.checks.result == 'success' ||
         (github.event_name == 'workflow_dispatch' && inputs.platform == 'windows'))
      }}
    runs-on: windows-2022
    env:
      SIGPILOT_PREBUILT_NATIVE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js for pnpm
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Cache pnpm with Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: true
          shared-key: client-x86_64-pc-windows-msvc-release
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native runtime
        uses: actions/download-artifact@v8
        with:
          name: native-runtime-windows-x64
          path: ${{ runner.temp }}/native-runtime

      - name: Install verified native runtime
        shell: pwsh
        run: node scripts/native-runtime.mjs install "${{ runner.temp }}/native-runtime/native-runtime-windows-x64.tar.gz" windows-x64

      - name: Build portable Tauri executable
        shell: pwsh
        env:
          TAURI_SKIP_DEVTOOLS_CHECK: true
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle --ci

      - name: Stage Windows portable bundle
        shell: pwsh
        run: |
          $releaseRoot = "target/x86_64-pc-windows-msvc/release"
          $executable = Join-Path $releaseRoot "sigpilot-desktop.exe"
          $portableRoot = Join-Path $releaseRoot "portable"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Tauri did not produce $executable"
          }
          Remove-Item -LiteralPath $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portableRoot | Out-Null
          Copy-Item -LiteralPath $executable -Destination (Join-Path $portableRoot "SigPilot.exe")
          Copy-Item -LiteralPath "resources" -Destination $portableRoot -Recurse

          $requiredPaths = @(
            "resources/bitstreams/hspi_ddr.bin",
            "resources/bitstreams/hspi_ddr_RST.bin",
            "resources/native/sigrok-analyzer-sidecar/sigpilot-sigrok-sidecar.exe",
            "resources/native/sigrok-analyzer-sidecar/decoders/c_decoders",
            "resources/native/sigrok-analyzer-sidecar/decoders/python_decoders",
            "resources/native/sigrok-analyzer-sidecar/python-runtime",
            "resources/native/saleae-analyzer-sidecar/sigpilot-saleae-analyzer-sidecar.exe",
            "resources/native/saleae-analyzer-sidecar/runtime"
          )
          foreach ($relativePath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath (Join-Path $portableRoot $relativePath))) {
              throw "Portable bundle is missing $relativePath"
            }
          }

      - name: Smoke test Windows portable bundle
        shell: pwsh
        run: |
          $portableRoot = "target/x86_64-pc-windows-msvc/release/portable"
          node scripts/smoke-native-runtime.mjs "$portableRoot/resources/native"

      - name: Archive Windows portable bundle
        shell: pwsh
        run: |
          $releaseRoot = "target/x86_64-pc-windows-msvc/release"
          $portableRoot = Join-Path $releaseRoot "portable"
          $bundleRoot = Join-Path $releaseRoot "bundle"
          $archive = Join-Path $bundleRoot "sigpilot-windows-x64-portable.zip"
          New-Item -ItemType Directory -Path $bundleRoot -Force | Out-Null
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$portableRoot/*" -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sigpilot-windows-x64-portable
          path: target/x86_64-pc-windows-msvc/release/bundle/sigpilot-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux x64
    needs: [checks, native-linux]
    if: >-
      ${{
        needs.checks.result == 'success' &&
        needs.native-linux.result == 'success' &&
        (github.event_name != 'workflow_dispatch' || inputs.platform == 'all')
      }}
    runs-on: ubuntu-22.04
    env:
      SIGPILOT_PREBUILT_NATIVE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          packages=(
            jq
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libusb-1.0-0-dev
            patchelf
            libfuse2
          )
          missing_packages=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null | grep -q '^ii ' \
              || missing_packages+=("$package")
          done
          if (( ${#missing_packages[@]} == 0 )); then
            echo "Linux build dependencies are already installed."
            exit 0
          fi
          host_arch="$(dpkg --print-architecture)"
          apt_arch_args=(
            -o "APT::Architecture=${host_arch}"
            -o "APT::Architectures=${host_arch}"
            -o "Acquire::http::Timeout=30"
            -o "Acquire::https::Timeout=30"
            -o "Acquire::Retries=3"
            -o "DPkg::Lock::Timeout=60"
          )
          sudo apt-get "${apt_arch_args[@]}" update
          sudo apt-get "${apt_arch_args[@]}" install -y "${missing_packages[@]}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node.js for pnpm
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Cache pnpm with Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: true
          shared-key: client-x86_64-unknown-linux-gnu-release
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native runtime
        uses: actions/download-artifact@v8
        with:
          name: native-runtime-linux-x64
          path: ${{ runner.temp }}/native-runtime

      - name: Install verified native runtime
        run: node scripts/native-runtime.mjs install "${{ runner.temp }}/native-runtime/native-runtime-linux-x64.tar.gz" linux-x64

      - name: Build Tauri packages
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb --ci

      - name: Verify AppImage payload and name artifacts
        run: |
          set -euo pipefail
          bundle_root="target/x86_64-unknown-linux-gnu/release/bundle"
          appimage="$(find "$bundle_root/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb="$(find "$bundle_root/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          cp "$appimage" "$bundle_root/sigpilot-linux-x64.AppImage"
          cp "$deb" "$bundle_root/sigpilot-linux-x64.deb"
          chmod 755 "$bundle_root/sigpilot-linux-x64.AppImage"

          extract_dir="$(mktemp -d)"
          cd "$extract_dir"
          "$GITHUB_WORKSPACE/$bundle_root/sigpilot-linux-x64.AppImage" --appimage-extract >/dev/null
          packaged_sidecar="$(find squashfs-root -type f -name sigpilot-sigrok-sidecar -print -quit)"
          test -n "$packaged_sidecar"
          packaged_root="$(dirname "$packaged_sidecar")"
          test -f "$(find squashfs-root -type f -name hspi_ddr.bin -print -quit)"
          node "$GITHUB_WORKSPACE/scripts/smoke-native-runtime.mjs" "$(dirname "$packaged_root")"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sigpilot-linux-x64
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/sigpilot-linux-x64.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/sigpilot-linux-x64.deb
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: [checks, native-macos]
    if: >-
      ${{
        needs.checks.result == 'success' &&
        needs.native-macos.result == 'success' &&
        (github.event_name != 'workflow_dispatch' || inputs.platform == 'all')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            native_arch: arm64
            runner: macos-15
          - arch: x64
            target: x86_64-apple-darwin
            native_arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      SIGPILOT_PREBUILT_NATIVE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The restored sigrok runtime still links against Homebrew libraries.
      - name: Install native runtime dependencies
        run: brew install glib jq python@3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js for pnpm
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Cache pnpm with Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: true
          shared-key: client-${{ matrix.target }}-release
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native runtime
        uses: actions/download-artifact@v8
        with:
          name: native-runtime-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-runtime

      - name: Install verified native runtime
        run: node scripts/native-runtime.mjs install "${{ runner.temp }}/native-runtime/native-runtime-macos-${{ matrix.arch }}.tar.gz" macos-${{ matrix.arch }}

      - name: Build Tauri app bundle
        env:
          SIGPILOT_MACOS_ARCH: ${{ matrix.native_arch }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app --ci --no-sign

      - name: Verify bundled native decoders
        run: |
          set -euo pipefail
          bundle_root="target/${{ matrix.target }}/release/bundle"
          app="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          sidecar="$(find "$app/Contents/Resources" -type f \
            -name sigpilot-saleae-analyzer-sidecar -print -quit)"
          test -n "$sidecar"
          runtime_root="$(dirname "$sidecar")/runtime"
          test -f "$runtime_root/libsaleae_compat.dylib"
          test -f "$runtime_root/libspi_analyzer.so"
          "$sidecar" --runtime-root "$runtime_root" --probe \
            | jq -e '.available == true and (.protocols | length) > 0'
          jq '.cases[0]' testdata/decoders/spi-conformance-v1.json \
            | "$sidecar" --runtime-root "$runtime_root" --decode \
            | jq -e '.backend == "saleae_native" and (.frames | length) > 0'
          node scripts/smoke-native-runtime.mjs "$(dirname "$(dirname "$sidecar")")"

      - name: Name macOS artifact
        run: |
          set -euo pipefail
          bundle_root="target/${{ matrix.target }}/release/bundle"
          app="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "$bundle_root/sigpilot-macos-${{ matrix.arch }}.app.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: sigpilot-macos-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/sigpilot-macos-${{ matrix.arch }}.app.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    # A successful platform package should not be held back by another runner.
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v') &&
        (needs.build-windows.result == 'success' ||
         needs.build-linux.result == 'success' ||
         needs.build-macos.result == 'success')
      }}
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download client artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sigpilot-*
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: false
