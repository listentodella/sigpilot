name: Build Cross-Platform

on:
  push:
    branches: [codex/graph-server-32ch, main, master]
    tags: ["v*"]
  pull_request:
    branches: [codex/graph-server-32ch, main, master]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  checks:
    name: Tests and frontend
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          packages=(
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libusb-1.0-0-dev
          )
          missing_packages=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null | grep -q '^ii ' \
              || missing_packages+=("$package")
          done
          if (( ${#missing_packages[@]} == 0 )); then
            echo "Linux build dependencies are already installed."
            exit 0
          fi
          host_arch="$(dpkg --print-architecture)"
          apt_arch_args=(
            -o "APT::Architecture=${host_arch}"
            -o "APT::Architectures=${host_arch}"
            -o "Acquire::http::Timeout=30"
            -o "Acquire::https::Timeout=30"
            -o "Acquire::Retries=3"
            -o "DPkg::Lock::Timeout=60"
          )
          sudo apt-get "${apt_arch_args[@]}" update
          sudo apt-get "${apt_arch_args[@]}" install -y "${missing_packages[@]}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: false
          shared-key: source-only

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test UI logic
        run: node --test tests/*.test.ts

      - name: Build frontend
        run: pnpm build

  build-windows:
    name: Windows x64
    needs: checks
    runs-on: [self-hosted, Windows, X64]
    env:
      PXLOGIC_SIGROK_BUILD_DIR: C:/pxlogic-native-cache/sigrok-ucrt64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect persistent MSYS2 installation
        id: detect-msys2
        shell: pwsh
        run: |
          $installed = Test-Path "C:\msys64\usr\bin\pacman.exe"
          "installed=$($installed.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup persistent MSYS2 environment
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: C:\
          release: ${{ steps.detect-msys2.outputs.installed != 'true' }}
          update: false
          cache: false

      - name: Install missing MSYS2 build dependencies
        shell: msys2 {0}
        run: |
          packages=(
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-jq
          )
          missing_packages=()
          package_or_group_installed() {
            if pacman -Q "$1" >/dev/null 2>&1; then
              return 0
            fi
            local members member
            members="$(pacman -Sgq "$1" 2>/dev/null)" || return 1
            [[ -n "$members" ]] || return 1
            while IFS= read -r member; do
              pacman -Q "$member" >/dev/null 2>&1 || return 1
            done <<<"$members"
          }
          for package in "${packages[@]}"; do
            package_or_group_installed "$package" || missing_packages+=("$package")
          done
          if (( ${#missing_packages[@]} == 0 )); then
            echo "MSYS2 build dependencies are already installed."
            exit 0
          fi
          pacman --noconfirm -S --needed "${missing_packages[@]}"

      - name: Export MSYS2 paths for resource preparation
        shell: pwsh
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          "$msysRoot\usr\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "$msysRoot\ucrt64\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYSTEM=UCRT64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CHERE_INVOKING=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: false
          shared-key: source-only

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native Sigrok decoder
        shell: msys2 {0}
        run: native/sigrok-analyzer-sidecar/verify.sh

      - name: Prepare and probe bundled resources
        shell: msys2 {0}
        env:
          PXLOGIC_REUSE_SIGROK_BUILD: "1"
        run: |
          scripts/prepare-tauri-resources.sh
          sidecar="resources/native/sigrok-analyzer-sidecar/pxlogic-sigrok-sidecar.exe"
          decoder_root="resources/native/sigrok-analyzer-sidecar/decoders/c_decoders"
          python_root="resources/native/sigrok-analyzer-sidecar/decoders/python_decoders"
          python_home="resources/native/sigrok-analyzer-sidecar/python-runtime"
          test -f resources/bitstreams/hspi_ddr.bin
          test -f resources/bitstreams/hspi_ddr_RST.bin
          test -x "$sidecar"
          test -d "$decoder_root"
          test -d "$python_root"
          test -d "$python_home"
          PYTHONHOME="$python_home" native/sigrok-analyzer-sidecar/smoke-packaged.sh \
            "$sidecar" "$decoder_root" "$python_root"

      - name: Build portable Tauri executable
        shell: pwsh
        env:
          TAURI_SKIP_DEVTOOLS_CHECK: true
          PXLOGIC_REUSE_SIGROK_BUILD: "1"
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle --ci

      - name: Stage Windows portable bundle
        shell: pwsh
        run: |
          $releaseRoot = "target/x86_64-pc-windows-msvc/release"
          $executable = Join-Path $releaseRoot "pxlogic-desktop.exe"
          $portableRoot = Join-Path $releaseRoot "portable"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Tauri did not produce $executable"
          }
          Remove-Item -LiteralPath $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portableRoot | Out-Null
          Copy-Item -LiteralPath $executable -Destination (Join-Path $portableRoot "PXLogic Studio.exe")
          Copy-Item -LiteralPath "resources" -Destination $portableRoot -Recurse

          $requiredPaths = @(
            "resources/bitstreams/hspi_ddr.bin",
            "resources/bitstreams/hspi_ddr_RST.bin",
            "resources/native/sigrok-analyzer-sidecar/pxlogic-sigrok-sidecar.exe",
            "resources/native/sigrok-analyzer-sidecar/decoders/c_decoders",
            "resources/native/sigrok-analyzer-sidecar/decoders/python_decoders",
            "resources/native/sigrok-analyzer-sidecar/python-runtime"
          )
          foreach ($relativePath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath (Join-Path $portableRoot $relativePath))) {
              throw "Portable bundle is missing $relativePath"
            }
          }

      - name: Smoke test Windows portable bundle
        shell: msys2 {0}
        run: |
          portable_root="target/x86_64-pc-windows-msvc/release/portable"
          sigrok_root="$portable_root/resources/native/sigrok-analyzer-sidecar"
          PYTHONHOME="$sigrok_root/python-runtime" \
            native/sigrok-analyzer-sidecar/smoke-packaged.sh \
              "$sigrok_root/pxlogic-sigrok-sidecar.exe" \
              "$sigrok_root/decoders/c_decoders" \
              "$sigrok_root/decoders/python_decoders"

      - name: Archive Windows portable bundle
        shell: pwsh
        run: |
          $releaseRoot = "target/x86_64-pc-windows-msvc/release"
          $portableRoot = Join-Path $releaseRoot "portable"
          $bundleRoot = Join-Path $releaseRoot "bundle"
          $archive = Join-Path $bundleRoot "pxlogic-studio-windows-x64-portable.zip"
          New-Item -ItemType Directory -Path $bundleRoot -Force | Out-Null
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$portableRoot/*" -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pxlogic-windows-x64-portable
          path: target/x86_64-pc-windows-msvc/release/bundle/pxlogic-studio-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux x64
    needs: checks
    runs-on: [self-hosted, Linux, X64]
    env:
      PXLOGIC_COPY_NATIVE_DEPS: "1"
      PXLOGIC_SIGROK_BUILD_DIR: /tmp/pxlogic-native-cache/sigrok-linux-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          packages=(
            build-essential
            cmake
            jq
            ninja-build
            pkg-config
            python3-dev
            libglib2.0-dev
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libusb-1.0-0-dev
            patchelf
            libfuse2
          )
          missing_packages=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null | grep -q '^ii ' \
              || missing_packages+=("$package")
          done
          if (( ${#missing_packages[@]} == 0 )); then
            echo "Linux build dependencies are already installed."
            exit 0
          fi
          host_arch="$(dpkg --print-architecture)"
          apt_arch_args=(
            -o "APT::Architecture=${host_arch}"
            -o "APT::Architectures=${host_arch}"
            -o "Acquire::http::Timeout=30"
            -o "Acquire::https::Timeout=30"
            -o "Acquire::Retries=3"
            -o "DPkg::Lock::Timeout=60"
          )
          sudo apt-get "${apt_arch_args[@]}" update
          sudo apt-get "${apt_arch_args[@]}" install -y "${missing_packages[@]}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: false
          shared-key: source-only

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native Sigrok decoder
        run: native/sigrok-analyzer-sidecar/verify.sh

      - name: Prepare and probe bundled resources
        env:
          PXLOGIC_REUSE_SIGROK_BUILD: "1"
        run: |
          scripts/prepare-tauri-resources.sh
          sidecar="resources/native/sigrok-analyzer-sidecar/pxlogic-sigrok-sidecar"
          decoder_root="resources/native/sigrok-analyzer-sidecar/decoders/c_decoders"
          python_root="resources/native/sigrok-analyzer-sidecar/decoders/python_decoders"
          python_home="resources/native/sigrok-analyzer-sidecar/python-runtime"
          test -f resources/bitstreams/hspi_ddr.bin
          test -f resources/bitstreams/hspi_ddr_RST.bin
          test -x "$sidecar"
          test -d "$decoder_root"
          test -d "$python_root"
          test -d "$python_home"
          PYTHONHOME="$python_home" native/sigrok-analyzer-sidecar/smoke-packaged.sh \
            "$sidecar" "$decoder_root" "$python_root"

      - name: Build Tauri packages
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb --ci

      - name: Verify AppImage payload and name artifacts
        run: |
          set -euo pipefail
          bundle_root="target/x86_64-unknown-linux-gnu/release/bundle"
          appimage="$(find "$bundle_root/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb="$(find "$bundle_root/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          cp "$appimage" "$bundle_root/pxlogic-studio-linux-x64.AppImage"
          cp "$deb" "$bundle_root/pxlogic-studio-linux-x64.deb"
          chmod 755 "$bundle_root/pxlogic-studio-linux-x64.AppImage"

          extract_dir="$(mktemp -d)"
          cd "$extract_dir"
          "$GITHUB_WORKSPACE/$bundle_root/pxlogic-studio-linux-x64.AppImage" --appimage-extract >/dev/null
          packaged_sidecar="$(find squashfs-root -type f -name pxlogic-sigrok-sidecar -print -quit)"
          test -n "$packaged_sidecar"
          packaged_root="$(dirname "$packaged_sidecar")"
          test -f "$(find squashfs-root -type f -name hspi_ddr.bin -print -quit)"
          PYTHONHOME="$packaged_root/python-runtime" \
            "$GITHUB_WORKSPACE/native/sigrok-analyzer-sidecar/smoke-packaged.sh" \
            "$packaged_sidecar" \
            "$packaged_root/decoders/c_decoders" \
            "$packaged_root/decoders/python_decoders"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pxlogic-linux-x64
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/pxlogic-studio-linux-x64.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/pxlogic-studio-linux-x64.deb
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Sigrok build dependencies
        run: brew install cmake glib jq pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: false
          shared-key: source-only

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app bundle
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app --ci --no-sign

      - name: Name macOS artifact
        run: |
          set -euo pipefail
          bundle_root="target/${{ matrix.target }}/release/bundle"
          app="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "$bundle_root/pxlogic-studio-macos-${{ matrix.arch }}.app.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: pxlogic-macos-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/pxlogic-studio-macos-${{ matrix.arch }}.app.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
