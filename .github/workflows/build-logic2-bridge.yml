name: Build Logic 2 Bridge

on:
  push:
    paths:
      - ".github/workflows/build-logic2-bridge.yml"
      - "tools/logic2-bridge/**"
      - "src-tauri/src/bin/usb_smoke.rs"
      - "crates/pxlogic-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "resources/bitstreams/**"
      - "resources/firmware/**"
  workflow_dispatch:

concurrency:
  group: logic2-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  portable-layer:
    name: Portable layer (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux x64
            runner: ubuntu-latest
          - os_name: Windows x64
            runner: windows-latest
          - os_name: macOS arm64
            runner: macos-15
          - os_name: macOS x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check bridge JavaScript
        run: npm --prefix tools/logic2-bridge run check

      - name: Test bridge protocol and conversion layers
        run: npm --prefix tools/logic2-bridge test

  capture-helper:
    name: PXLogic helper (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux x64
            artifact: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: usb_smoke
          - os_name: Windows x64
            artifact: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: usb_smoke.exe
          - os_name: macOS arm64
            artifact: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: usb_smoke
          - os_name: macOS x64
            artifact: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: usb_smoke
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux USB build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: false
          shared-key: logic2-bridge-helper-${{ matrix.target }}

      - name: Build PXLogic capture helper
        run: cargo build --release --bin usb_smoke --target ${{ matrix.target }}

      - name: Verify bridge helper contract
        if: runner.os != 'Windows'
        run: |
          target/${{ matrix.target }}/release/${{ matrix.binary }} --help \
            | grep -q -- "--live-cross-only"

      - name: Verify bridge helper contract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helper = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $helpText = (& $helper --help) -join "`n"
          if (-not $helpText.Contains("--live-cross-only")) {
            throw "$helper does not implement the bridge live-cross-only contract"
          }

      - name: Upload helper and hardware resources
        uses: actions/upload-artifact@v7
        with:
          name: pxlogic-bridge-prerequisites-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary }}
            resources/bitstreams/hspi_ddr.bin
            resources/bitstreams/hspi_ddr_RST.bin
            resources/bitstreams/LICENSE.txt
            resources/firmware/SCI_LOGIC.bin
          if-no-files-found: error
          retention-days: 30

  build-macos-arm64:
    name: Runnable bridge (macOS arm64)
    needs: [portable-layer, capture-helper]
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: false
          shared-key: logic2-bridge

      - name: Build PXLogic capture helper
        run: cargo build --release --bin usb_smoke --target aarch64-apple-darwin

      - name: Verify bridge helper contract
        run: |
          target/aarch64-apple-darwin/release/usb_smoke --help \
            | grep -q -- "--live-cross-only"

      - name: Build version-locked GraphServer host
        run: |
          mkdir -p tools/logic2-bridge/build
          xcrun clang \
            -std=c11 \
            -O2 \
            -Wall \
            -Wextra \
            tools/logic2-bridge/native/graph-host.c \
            -o tools/logic2-bridge/build/graph-host

      - name: Stage runnable bundle
        run: |
          set -euo pipefail
          bundle_root="dist/pxlogic-logic2-bridge-macos-arm64"
          mkdir -p \
            "$bundle_root/tools" \
            "$bundle_root/target/release" \
            "$bundle_root/resources/bitstreams" \
            "$bundle_root/resources/firmware"
          cp -R tools/logic2-bridge "$bundle_root/tools/"
          cp target/aarch64-apple-darwin/release/usb_smoke \
            "$bundle_root/target/release/usb_smoke"
          cp resources/bitstreams/hspi_ddr.bin \
            resources/bitstreams/hspi_ddr_RST.bin \
            resources/bitstreams/LICENSE.txt \
            "$bundle_root/resources/bitstreams/"
          cp resources/firmware/SCI_LOGIC.bin \
            "$bundle_root/resources/firmware/"

      - name: Verify bundle layout and architectures
        run: |
          set -euo pipefail
          bundle_root="dist/pxlogic-logic2-bridge-macos-arm64"
          node "$bundle_root/tools/logic2-bridge/index.cjs" --help
          file "$bundle_root/tools/logic2-bridge/build/graph-host" \
            | grep -q "arm64"
          file "$bundle_root/target/release/usb_smoke" \
            | grep -q "arm64"
          test -f "$bundle_root/resources/bitstreams/hspi_ddr.bin"
          test -f "$bundle_root/resources/bitstreams/hspi_ddr_RST.bin"
          test -f "$bundle_root/resources/firmware/SCI_LOGIC.bin"

      - name: Archive runnable bridge
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/pxlogic-logic2-bridge-macos-arm64 \
            dist/pxlogic-logic2-bridge-macos-arm64.zip

      - name: Upload runnable bridge
        uses: actions/upload-artifact@v7
        with:
          name: pxlogic-logic2-bridge-macos-arm64
          path: dist/pxlogic-logic2-bridge-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
