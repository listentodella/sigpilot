name: Build Logic 2 Bridge

on:
  push:
    paths:
      - ".github/workflows/build-logic2-bridge.yml"
      - "tools/logic2-bridge/**"
      - "src-tauri/src/bin/usb_smoke.rs"
      - "crates/pxlogic-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "resources/bitstreams/**"
      - "resources/firmware/**"
  workflow_dispatch:
    inputs:
      analyze_official_packages:
        description: Download official Logic 2.4.46 packages and fingerprint GraphServer
        required: false
        default: false
        type: boolean

concurrency:
  group: logic2-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  portable-layer:
    name: Portable layer (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux x64
            runner: [self-hosted, Linux, X64]
          - os_name: Windows x64
            runner: [self-hosted, Windows, X64]
          - os_name: macOS arm64
            runner: macos-15
          - os_name: macOS x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check bridge JavaScript
        run: |
          npm --prefix tools/logic2-bridge run check
          npm --prefix tools/logic2-bridge/client run check

      - name: Test bridge protocol and conversion layers
        run: npm --prefix tools/logic2-bridge test

  capture-helper:
    name: PXLogic helper (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux x64
            artifact: linux-x64
            runner: [self-hosted, Linux, X64]
            target: x86_64-unknown-linux-gnu
            binary: usb_smoke
          - os_name: Windows x64
            artifact: windows-x64
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
            binary: usb_smoke.exe
          - os_name: macOS arm64
            artifact: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: usb_smoke
          - os_name: macOS x64
            artifact: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: usb_smoke
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux USB build dependencies
        if: runner.os == 'Linux'
        run: |
          packages=(
            libayatana-appindicator3-dev
            libgtk-3-dev
            libudev-dev
            libusb-1.0-0-dev
            libwebkit2gtk-4.1-dev
            pkg-config
          )
          missing_packages=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null | grep -q '^ii ' \
              || missing_packages+=("$package")
          done
          if (( ${#missing_packages[@]} == 0 )); then
            echo "Linux USB build dependencies are already installed."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y "${missing_packages[@]}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: false
          shared-key: logic2-bridge-helper-${{ matrix.target }}

      - name: Build PXLogic capture helper
        run: cargo build --release --bin usb_smoke --target ${{ matrix.target }}

      - name: Verify bridge helper contract
        if: runner.os != 'Windows'
        run: |
          target/${{ matrix.target }}/release/${{ matrix.binary }} --help \
            | grep -q -- "--live-cross-only"

      - name: Verify bridge helper contract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helper = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $helpText = (& $helper --help) -join "`n"
          if (-not $helpText.Contains("--live-cross-only")) {
            throw "$helper does not implement the bridge live-cross-only contract"
          }

      - name: Upload helper and hardware resources
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: pxlogic-bridge-prerequisites-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary }}
            resources/bitstreams/hspi_ddr.bin
            resources/bitstreams/hspi_ddr_RST.bin
            resources/bitstreams/LICENSE.txt
            resources/firmware/SCI_LOGIC.bin
          if-no-files-found: error
          retention-days: 30

  tauri-client-check:
    name: Tauri client check (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux x64
            runner: [self-hosted, Linux, X64]
          - os_name: Windows x64
            runner: [self-hosted, Windows, X64]
          - os_name: macOS arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          packages=(
            libayatana-appindicator3-dev
            libgtk-3-dev
            libwebkit2gtk-4.1-dev
            libxdo-dev
            libssl-dev
            librsvg2-dev
          )
          missing_packages=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null | grep -q '^ii ' \
              || missing_packages+=("$package")
          done
          if (( ${#missing_packages[@]} == 0 )); then
            echo "Linux Tauri dependencies are already installed."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y "${missing_packages[@]}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri client dependencies
        run: npm --prefix tools/logic2-bridge/tauri-client ci

      - name: Check shared renderer and bridge
        run: |
          npm --prefix tools/logic2-bridge run check
          npm --prefix tools/logic2-bridge/client run check

      - name: Test Tauri client
        env:
          # The check job validates Rust/renderer code only. Native helper and
          # GraphServer payloads are produced by the platform build job.
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: npm --prefix tools/logic2-bridge/tauri-client test

  linux-native-host-check:
    name: Linux GraphServer host compile check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile Linux native host
        run: |
          mkdir -p /tmp/pxlogic-bridge-build
          cc -std=c11 -O2 -Wall -Wextra \
            tools/logic2-bridge/native/graph-host.c \
            -o /tmp/pxlogic-bridge-build/graph-host \
            -ldl -pthread
          file /tmp/pxlogic-bridge-build/graph-host | grep -E 'ELF 64-bit|x86-64'

      - name: Verify Linux profile record
        run: |
          node - <<'NODE'
          const manifest = require('./tools/logic2-bridge/compatibility/profiles.json');
          const profile = manifest.profiles.find(item => item.platform === 'linux');
          if (!profile || profile.hook.status !== 'pending-live-validation') {
            throw new Error('Linux profile must remain explicitly pending live validation');
          }
          console.log(profile.id, profile.hook.onDataBufferOffset);
          NODE

  analyze-official-packages:
    name: Fingerprint official GraphServer (${{ matrix.os_name }})
    if: github.event_name == 'workflow_dispatch' && inputs.analyze_official_packages == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux x64
            runner: [self-hosted, Linux, X64]
            package_type: appimage
            package_url: https://downloads2.saleae.com/logic2/Logic-2.4.46-linux-x64.AppImage
            artifact: linux-x64
          - os_name: Windows x64
            runner: [self-hosted, Windows, X64]
            package_type: advanced-installer
            package_url: https://downloads2.saleae.com/logic2/Logic-2.4.46-windows-x64.exe
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download and extract Linux GraphServer
        if: matrix.package_type == 'appimage'
        run: |
          curl -L --fail --retry 3 \
            "${{ matrix.package_url }}" \
            -o Logic-2.4.46-linux-x64.AppImage
          chmod +x Logic-2.4.46-linux-x64.AppImage
          ./Logic-2.4.46-linux-x64.AppImage --appimage-extract >/dev/null
          graph=$(find squashfs-root -type f -name 'libgraph_server_shared.so' -print -quit)
          test -n "$graph"
          node tools/logic2-bridge/scripts/fingerprint-binary.cjs "$graph" \
            | tee graph-fingerprint-${{ matrix.artifact }}.json

      - name: Download and extract Windows GraphServer
        if: matrix.package_type == 'advanced-installer'
        shell: pwsh
        run: |
          & curl.exe -L --fail --retry 3 "${{ matrix.package_url }}" -o Logic-2.4.46-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Logic 2 download failed' }
          node tools/logic2-bridge/scripts/extract-advanced-installer-cab.cjs Logic-2.4.46-windows-x64.exe Logic-2.4.46-windows-x64.cab
          New-Item -ItemType Directory -Path windows-graph | Out-Null
          & expand.exe Logic-2.4.46-windows-x64.cab -F:graph_server_shared.dll_1 windows-graph
          if ($LASTEXITCODE -ne 0) { throw 'GraphServer CAB extraction failed' }
          $graph = 'windows-graph/graph_server_shared.dll_1'
          node tools/logic2-bridge/scripts/fingerprint-binary.cjs $graph | Tee-Object -FilePath graph-fingerprint-${{ matrix.artifact }}.json
          node tools/logic2-bridge/scripts/locate-windows-on-data-buffer.cjs $graph | Tee-Object -FilePath graph-hook-${{ matrix.artifact }}.json

      - name: Upload fingerprint report
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: logic2-4-46-graphserver-fingerprint-${{ matrix.artifact }}
          path: |
            graph-fingerprint-${{ matrix.artifact }}.json
            graph-hook-${{ matrix.artifact }}.json
          if-no-files-found: error
          retention-days: 14

  build-macos-arm64:
    name: Desktop client (macOS arm64, Tauri)
    needs: [portable-layer, capture-helper, tauri-client-check, linux-native-host-check]
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: false
          shared-key: logic2-bridge

      - name: Build PXLogic capture helper
        run: cargo build --release --bin usb_smoke --target aarch64-apple-darwin

      - name: Verify bridge helper contract
        run: |
          target/aarch64-apple-darwin/release/usb_smoke --help \
            | grep -q -- "--live-cross-only"

      - name: Build GraphServer host
        run: |
          mkdir -p tools/logic2-bridge/build
          xcrun clang \
            -std=c11 \
            -O2 \
            -Wall \
            -Wextra \
            tools/logic2-bridge/native/graph-host.c \
            -o tools/logic2-bridge/build/graph-host

      - name: Install Tauri client build dependencies
        run: npm --prefix tools/logic2-bridge/tauri-client ci

      - name: Prepare native payload
        working-directory: tools/logic2-bridge/tauri-client
        run: npm run prepare:payload

      - name: Build desktop app bundle
        working-directory: tools/logic2-bridge/tauri-client
        run: |
          npx tauri build --target aarch64-apple-darwin \
            --config src-tauri/tauri.macos.conf.json --bundles app

      - name: Verify application bundle
        run: |
          set -euo pipefail
          app_root="target/aarch64-apple-darwin/release/bundle/macos/PXLogic Bridge.app"
          app_executable="$app_root/Contents/MacOS/pxlogic-logic2-bridge-client"
          resources="$app_root/Contents/Resources"
          bridge_entry="$resources/tools/logic2-bridge/index.cjs"
          node "$bridge_entry" --help \
            | grep -q "No npm install is required"
          file "$app_executable" | grep -q "arm64"
          file "$resources/tools/logic2-bridge/build/graph-host" \
            | grep -q "arm64"
          test -f "$resources/tools/logic2-bridge/compatibility/profiles.json"
          file "$resources/target/release/usb_smoke" \
            | grep -q "arm64"
          test -f "$resources/resources/bitstreams/hspi_ddr.bin"
          test -f "$resources/resources/bitstreams/hspi_ddr_RST.bin"
          test -f "$resources/resources/firmware/SCI_LOGIC.bin"

      - name: Build DMG installer
        working-directory: tools/logic2-bridge/tauri-client
        run: |
          npx tauri build --target aarch64-apple-darwin \
            --config src-tauri/tauri.macos.conf.json --bundles dmg

      - name: Verify DMG installer
        run: test -f "target/aarch64-apple-darwin/release/bundle/dmg/PXLogic Bridge_0.3.0_aarch64.dmg"

      - name: Upload desktop client
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: pxlogic-logic2-bridge-client-macos-arm64
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/PXLogic Bridge_0.3.0_aarch64.dmg
          if-no-files-found: error
          retention-days: 30

  build-linux-x64:
    name: Desktop client (Linux x64, diagnostic)
    needs: [portable-layer, capture-helper, tauri-client-check, linux-native-host-check]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          packages=(
            libayatana-appindicator3-dev
            libgtk-3-dev
            libudev-dev
            libusb-1.0-0-dev
            libwebkit2gtk-4.1-dev
            libxdo-dev
            libssl-dev
            librsvg2-dev
            pkg-config
          )
          missing_packages=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null | grep -q '^ii ' \
              || missing_packages+=("$package")
          done
          if (( ${#missing_packages[@]} == 0 )); then
            echo "Linux build dependencies are already installed."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y "${missing_packages[@]}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: false
          shared-key: logic2-bridge-linux-x64

      - name: Install Tauri client build dependencies
        run: npm --prefix tools/logic2-bridge/tauri-client ci

      - name: Prepare Linux native payload
        working-directory: tools/logic2-bridge/tauri-client
        env:
          TAURI_TARGET: x86_64-unknown-linux-gnu
        run: npm run prepare:payload

      - name: Build Linux installers
        working-directory: tools/logic2-bridge/tauri-client
        run: |
          npx tauri build --target x86_64-unknown-linux-gnu \
            --config src-tauri/tauri.linux.conf.json

      - name: Verify Linux installers
        run: |
          set -euo pipefail
          file tools/logic2-bridge/build/payload/graph-host | grep -E 'ELF 64-bit|x86-64'
          file tools/logic2-bridge/build/payload/usb_smoke | grep -E 'ELF 64-bit|x86-64'
          find target/x86_64-unknown-linux-gnu/release/bundle/appimage \
            -maxdepth 1 -type f -name '*.AppImage' -print -quit | grep -q .
          find target/x86_64-unknown-linux-gnu/release/bundle/deb \
            -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .

      - name: Upload Linux diagnostic client
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: pxlogic-logic2-bridge-client-linux-x64-diagnostic
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  build-windows-x64:
    name: Desktop client (Windows x64, diagnostic)
    needs: [portable-layer, capture-helper, tauri-client-check, linux-native-host-check]
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"
          cache-targets: false
          shared-key: logic2-bridge-windows-x64

      - name: Install Tauri client build dependencies
        run: npm --prefix tools/logic2-bridge/tauri-client ci

      - name: Prepare Windows native payload
        working-directory: tools/logic2-bridge/tauri-client
        env:
          TAURI_TARGET: x86_64-pc-windows-msvc
        run: npm run prepare:payload

      - name: Build Windows installers
        working-directory: tools/logic2-bridge/tauri-client
        run: |
          npx tauri build --target x86_64-pc-windows-msvc `
            --config src-tauri/tauri.windows.conf.json

      - name: Verify Windows installers
        shell: pwsh
        run: |
          if (-not (Test-Path tools/logic2-bridge/build/payload/usb_smoke.exe)) {
            throw 'Windows PXLogic helper payload is missing'
          }
          $nsis = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis -File -Filter *.exe
          $msi = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/msi -File -Filter *.msi
          if (-not $nsis) { throw 'NSIS installer was not produced' }
          if (-not $msi) { throw 'MSI installer was not produced' }

      - name: Upload Windows diagnostic client
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: pxlogic-logic2-bridge-client-windows-x64-diagnostic
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
