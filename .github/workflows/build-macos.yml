name: Build macOS

on:
  push:
    branches:
      - codex/graph-server-32ch
      - main
      - master
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - codex/graph-server-32ch
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Checks
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run UI logic tests
        run: node --test tests/*.test.ts

      - name: Build frontend
        run: pnpm build

  build-macos:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-26
          - arch: x64
            target: x86_64-apple-darwin
            runner: macos-26-intel

    runs-on: ${{ matrix.runner }}

    name: Build macOS (${{ matrix.arch }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".->target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app --ci --no-sign

      - name: Prepare macOS artifacts
        shell: bash
        run: |
          set -euo pipefail

          bundle_root="target/${{ matrix.target }}/release/bundle"
          app_dir="$bundle_root/macos"

          if [[ ! -d "$app_dir" ]]; then
            echo "Missing macOS app bundle directory: $app_dir" >&2
            exit 1
          fi

          app_path="$(find "$app_dir" -maxdepth 1 -name "*.app" -print -quit)"

          if [[ -z "$app_path" ]]; then
            echo "No .app bundle found in $app_dir" >&2
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "$bundle_root/pxlogic-studio-macos-${{ matrix.arch }}.app.zip"
          cp "target/${{ matrix.target }}/release/pxlogic-desktop" \
            "$bundle_root/pxlogic-desktop-macos-${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pxlogic-macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/pxlogic-studio-macos-${{ matrix.arch }}.app.zip
            target/${{ matrix.target }}/release/bundle/pxlogic-desktop-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pxlogic-macos-*
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
