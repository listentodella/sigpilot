[workspace]
members = [
    "crates/pxlogic-core",
    "crates/pxlogic-file",
    "crates/pxlogic-graph",
    "crates/pxlogic-waveform",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
block2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crc32fast = "1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }
parking_lot = "0.12"
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-build = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The capture hot path processes hundreds of millions of samples per second.
# Keeping these workspace crates at opt-level 0 makes `tauri dev` saturate a
# core even though packaged builds are smooth, which masks frontend regressions.
[profile.dev.package.pxlogic-core]
opt-level = 3

[profile.dev.package.pxlogic-graph]
opt-level = 3

[profile.dev.package.pxlogic-waveform]
opt-level = 3
