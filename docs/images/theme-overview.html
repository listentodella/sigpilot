<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SigPilot theme overview</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1600px; height: 1240px; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #edf3fc; background: radial-gradient(ellipse at 82% 25%, #233655 0%, transparent 48%), radial-gradient(ellipse at 15% 85%, #193b35 0%, transparent 48%), #0c1422; }
header { position: absolute; left: 88px; top: 58px; }
.eyebrow { font-size: 15px; letter-spacing: 3px; color: #96abc6; }
h1 { font-weight: 600; font-size: 42px; letter-spacing: -1px; margin: 12px 0 8px; }
header p { font-size: 18px; color: #a8b9cf; margin: 0; }
.card { position: absolute; width: 1056px; border-radius: 12px; overflow: hidden; border: 1px solid #ffffff38; box-shadow: 0 22px 65px #00000070; background: #172032; }
.bar { height: 38px; display: flex; align-items: center; padding: 0 16px; gap: 7px; background: var(--bar); }
.dot { height: 7px; width: 7px; border-radius: 50%; background: var(--accent); opacity: .75; }
.label { margin-left: 12px; font-size: 13px; font-weight: 600; color: var(--ink, #f2f6ff); letter-spacing: .3px; }
img { display: block; width: 1054px; height: auto; }
.c1 { left: 80px; top: 205px; opacity: .58; --bar: #eef1f5; --accent: #1369aa; --ink: #344054; }
.c2 { left: 180px; top: 271px; opacity: .70; --bar: #152a24; --accent: #69ff7a; }
.c3 { left: 280px; top: 337px; opacity: .80; --bar: #183337; --accent: #2aa198; }
.c4 { left: 380px; top: 403px; opacity: .90; --bar: #1c2b46; --accent: #62d6ff; }
.c5 { left: 480px; top: 469px; --bar: #262629; --accent: #c79579; }
footer { position: absolute; left: 88px; bottom: 35px; color: #8fa6c1; font-size: 13px; letter-spacing: .2px; }
</style>
</head>
<body>
<header><div class="eyebrow">SIGPILOT / APPEARANCE</div><h1>One workbench. Five perspectives.</h1><p>Built-in themes · Custom palettes · Per-channel colors</p></header>
<div class="card c1"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="label">Lab Light</span></div><img src="workbench-light.png" alt="Lab Light" /></div>
<div class="card c2"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="label">Terminal Green</span></div><img src="workbench-terminal-green.png" alt="Terminal Green" /></div>
<div class="card c3"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="label">Solarized Night</span></div><img src="workbench-solarized-night.png" alt="Solarized Night" /></div>
<div class="card c4"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="label">Midnight Aurora</span></div><img src="workbench-midnight-aurora.png" alt="Midnight Aurora" /></div>
<div class="card c5"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="label">Saleae Dark</span></div><img src="workbench-dark.png" alt="Saleae Dark" /></div>
<footer>Actual SigPilot frontend screenshots · Demo capture · Layered composition</footer>
</body>
</html>
