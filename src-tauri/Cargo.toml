[package]
name = "pxlogic-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"
default-run = "pxlogic-desktop"

[features]
default = ["rusb-transport"]
rusb-transport = ["pxlogic-core/rusb-transport"]

[dependencies]
pxlogic-core = { path = "../crates/pxlogic-core" }
pxlogic-file = { path = "../crates/pxlogic-file" }
pxlogic-graph = { path = "../crates/pxlogic-graph" }
pxlogic-waveform = { path = "../crates/pxlogic-waveform" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tracing.workspace = true

[build-dependencies]
tauri-build.workspace = true
