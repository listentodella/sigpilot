[package]
name = "sigpilot-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"
default-run = "sigpilot-desktop"

[features]
default = ["rusb-transport"]
rusb-transport = ["sigpilot-core/rusb-transport"]

[dependencies]
base64.workspace = true
sigpilot-core = { path = "../crates/sigpilot-core" }
sigpilot-file = { path = "../crates/sigpilot-file" }
sigpilot-graph = { path = "../crates/sigpilot-graph" }
sigpilot-waveform = { path = "../crates/sigpilot-waveform" }
parking_lot.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-web-kit.workspace = true

[build-dependencies]
tauri-build.workspace = true
